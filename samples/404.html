<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata | Proposte di siti</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/proposte-siti/assets/font.css">
<style>
:root { --tavolo: #ECEBE6; --testo: #1D2024; --tenue: #5E636A; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--tavolo); color: var(--testo); font: 400 1.0625rem/1.55 "Instrument Sans", system-ui, sans-serif; }
main { max-width: 34rem; padding: 3rem max(16px, env(safe-area-inset-left, 0px)); }
h1 { margin: 0 0 1rem; font: 400 clamp(2.5rem, 8vw, 4rem)/1 "Instrument Serif", Georgia, serif; }
p { margin: 0 0 1.5rem; color: var(--tenue); }
ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .5rem; }
a { color: var(--testo); font-weight: 600; text-underline-offset: .2em; }
:focus-visible { outline: 3px solid var(--testo); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Questa pagina non c’è</h1>
  <p>Il link potrebbe essere vecchio o scritto male. Da qui puoi tornare alle proposte.</p>
