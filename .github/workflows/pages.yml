name: Pubblica i sample su GitHub Pages

on:
  push:
    branches: [main]
    paths: ["samples/**", "strumenti/controlla.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # SEO, legale, accessibilità di base, link e impronte di CSS e JS: con un errore non si pubblica
      - name: Controllo delle pagine
        run: python3 strumenti/controlla.py samples --demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: samples
      - id: deployment
        uses: actions/deploy-pages@v4
